<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Semestre 1.0.2</title>
<!-- El estilo, en dos capas: general.css trae la estructura y la forma (tipografia,
     tamanos, rejillas), y cada tema-*.css trae SOLO la paleta de colores de un tema.
     Se cargan todos los temas y el que manda es la clase que lleva el <body>; asi cambiar
     de tema es instantaneo y no hay que recargar nada. -->
<link rel="stylesheet" href="css/general.css">
<link rel="stylesheet" href="css/tema-clasico.css">
<link rel="stylesheet" href="css/tema-negro.css">
<link rel="stylesheet" href="css/tema-medianoche.css">
<link rel="stylesheet" href="css/tema-deepsea.css">
<!-- Ajustes avanzados: tema, colores de estado, densidad y demas. Lo llena el programa. -->
<style id="av-vars"></style>
</head>
<body>
<noscript>
  <style>.tabs{display:none}main{display:none}</style>
  <div class="sinjs">
    <b>Este panel necesita JavaScript y aquí está bloqueado.</b>
    <p>No es un error del programa: el visor del panel abre los archivos HTML en un marco aislado que no
       ejecuta código, así que nada alcanza a dibujarse.</p>
    <p>Ábrelo en tu navegador y funciona completo:</p>
    <pre>xdg-open panel.html</pre>
    <p>Para verlo acá, usa <b>vista-previa.html</b>: es la misma pantalla ya dibujada, sin los
       controles que se mueven.</p>
  </div>
</noscript>

<header>
  <div class="fila">
    <h1>Panel de Semestre</h1>
    <span class="marca">v1.0.2</span>
    <span class="guardado" id="chip-guardado">Guardado aquí</span>
    <select class="sel" id="sem-activo"></select>
    <button class="btn chico" id="btn-nuevo-sem">+ Semestre</button>
    <button class="btn chico" id="btn-edit-sem" title="Editar semestre activo">Editar</button>
    <button class="btn chico" id="btn-borrar-sem" title="Borrar semestre activo">Borrar</button>
    <div class="tabs">
      <button class="tab on" data-panel="semestre">Calendario</button>
      <button class="tab" data-panel="estudio">Estudio</button>
      <button class="tab" data-panel="malla">Malla</button>
      <button class="tab" data-panel="notas">Notas</button>
      <button class="tab" data-panel="tiempo">Tiempo</button>
      <button class="tab" data-panel="ajustes">Ajustes</button>
    </div>
  </div>
</header>

<div class="banner-remoto" id="banner-remoto">
  <span id="banner-texto"></span>
  <button class="btn chico" id="banner-recargar">Recargar y ver los cambios</button>
  <button class="mini" id="banner-cerrar">Ahora no</button>
</div>

<main>
  <div class="muestra" id="aviso-muestra">
    <b>Esto es una muestra, no la aplicación.</b> Todo lo que cambies queda guardado en este navegador.
    Arriba a la izquierda puedes cambiar de semestre o crear uno nuevo. Recorre las cinco pestañas.
  </div>

  <!__SECCION__semestre__>

  <!__SECCION__estudio__>


  <!__SECCION__malla__>

  <!__SECCION__notas__>

  <!__SECCION__tiempo__>

  <!__SECCION__ajustes__>

  <!-- Barra global de cambios sin guardar: aparece al pie de cualquier pestana cuando
       hay ajustes o colores pendientes, para aceptarlos o descartarlos. -->
  <div id="aj-bar" class="aj-bar"></div>
</main>

<div class="modal" id="modal"><div class="modal-caja" id="modal-caja"></div></div>
<div class="modal" id="ayuda"><div class="modal-caja ayuda-caja" id="ayuda-caja"></div></div>
<div class="flotante" id="aviso"></div>

<script id="datos" type="application/json">__DATOS__</script>

<!-- La aplicacion, un archivo por tema. El orden esta en js/orden.txt y lo respeta el
     ensamblador: todo el codigo comparte un mismo espacio de nombres, asi que el orden importa.
     pdf.js NO se enlaza aqui: lo carga js/malla/04-pdf.js la primera vez que se importa un PDF,
     porque pesa 700 KB y la mayoria de las veces no hace falta. -->
__SCRIPTS__
</body>
</html>
